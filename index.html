<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finanze Pro - Smart Search</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.97); }
        .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="modal-debito" class="hidden fixed inset-0 z-[100] modal-overlay flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black italic uppercase">Dettaglio Debito</h3>
                <button onclick="closeDebitoModal()" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-full text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <div id="lista-debiti-dettaglio" class="space-y-4 max-h-[50vh] overflow-y-auto no-scrollbar"></div>
            <button onclick="closeDebitoModal()" class="w-full mt-6 py-4 bg-slate-900 text-white rounded-2xl font-bold active-scale">Chiudi</button>
        </div>
    </div>

    <div id="auth-view" class="flex items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-sm bg-white p-8 rounded-[2.5rem] shadow-2xl text-center border border-slate-100">
            <h1 id="app-title-trigger" class="text-3xl font-black text-blue-600 mb-8 italic uppercase tracking-tighter cursor-pointer">Finanze Pro</h1>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-50 rounded-2xl outline-none ring-1 ring-slate-100 focus:ring-blue-500">
                <input type="password" id="pass" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl outline-none ring-1 ring-slate-100 focus:ring-blue-500">
                <button onclick="handleAuth('login')" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg active-scale">Accedi</button>
                <button id="btn-register-hidden" onclick="handleAuth('register')" class="hidden w-full py-4 text-blue-600 border-2 border-blue-600 rounded-2xl font-bold active-scale mt-4">Registrati</button>
                <button onclick="resetPassword()" class="text-[11px] font-bold text-slate-400 hover:text-blue-600 uppercase">Recupero Password</button>
            </div>
        </div>
    </div>

    <div id="app-view" class="hidden max-w-6xl mx-auto px-4 sm:px-8 pb-20">
        <header class="flex justify-between items-center py-6">
            <div class="text-left">
                <h2 class="text-2xl font-black text-slate-800 italic uppercase">Dashboard</h2>
                <p id="current-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1"></p>
            </div>
            <button onclick="logout()" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm text-slate-400 active-scale border border-slate-100"><i data-lucide="log-out"></i></button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
            <div class="lg:col-span-2 bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden flex flex-col justify-center min-h-[160px]">
                <div class="relative z-10 text-left">
                    <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-1">Capitale Disponibile</p>
                    <h3 id="txt-residuo" class="text-4xl sm:text-6xl font-black italic tracking-tighter">€ 0,00</h3>
                </div>
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-600 opacity-20 rounded-full blur-3xl"></div>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-1 gap-4">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 flex flex-col justify-center text-left">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Spesa Filtrata</p>
                    <h4 id="txt-uscite-filtrate" class="text-xl font-bold text-slate-700">€ 0,00</h4>
                </div>
                <div onclick="openDebitoModal()" id="box-debito" class="bg-orange-50 p-6 rounded-[2rem] border border-orange-100 flex flex-col justify-center text-left transition-all opacity-50">
                    <p class="text-[9px] font-black text-orange-400 uppercase mb-1">Debito Residuo</p>
                    <h4 id="txt-debito-filtrato" class="text-xl font-bold text-orange-600">€ 0,00</h4>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                <input type="text" id="search-input" oninput="renderUI()" placeholder="Cerca beneficiario, causale, tipo..." class="w-full p-4 pl-12 bg-white rounded-2xl text-xs font-medium outline-none ring-1 ring-slate-100 focus:ring-blue-500 shadow-sm">
            </div>
            <button onclick="exportToPDF()" class="bg-emerald-600 text-white p-4 rounded-2xl text-xs font-black uppercase shadow-lg flex items-center justify-center gap-2 active-scale">
                <i data-lucide="file-down" class="w-4 h-4"></i> Esporta Report PDF
            </button>
        </div>

        <details class="group mb-12" id="form-details">
            <summary onclick="initFormTime()" class="list-none bg-blue-600 text-white p-5 rounded-[2rem] font-bold text-center cursor-pointer active-scale shadow-xl flex items-center justify-center gap-3">
                <i data-lucide="plus-circle" class="w-6 h-6"></i> REGISTRA NUOVO MOVIMENTO
            </summary>
            <div class="bg-white p-6 sm:p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 mt-4 text-left grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <input type="datetime-local" id="input-date" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="input-type" onchange="toggleSpeseVarie(this.value)" class="p-4 bg-slate-50 rounded-xl font-bold text-xs uppercase outline-none">
                            <option value="Bonifico">Bonifico</option>
                            <option value="Bollettino">Bollettino</option>
                            <option value="Spese Varie">Spese Varie</option>
                        </select>
                        <input type="number" id="input-amount" placeholder="Importo €" class="p-4 bg-slate-50 rounded-xl font-bold outline-none">
                    </div>
                    <div id="sub-spese-container" class="hidden space-y-3">
                        <select id="sub-type-spese" onchange="toggleAltroSpec(this.value)" class="w-full p-4 bg-blue-50 rounded-xl font-bold text-xs uppercase text-blue-700 outline-none">
                            <option value="Benzina">Benzina</option>
                            <option value="Abbigliamento">Abbigliamento</option>
                            <option value="Cibo">Cibo</option>
                            <option value="Altro">Altro...</option>
                        </select>
                        <input type="text" id="input-altro-spec" placeholder="Specifica spesa..." class="hidden w-full p-4 bg-white rounded-xl ring-1 ring-blue-200 outline-none font-bold text-sm">
                    </div>
                    <div class="relative">
                        <input type="text" id="input-to" oninput="checkAutoFill(this.value)" placeholder="Beneficiario" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold">
                        <div id="autofill-suggestion" class="hidden absolute left-0 right-0 top-full mt-2 p-3 bg-blue-700 text-white rounded-xl z-50 text-[10px] flex justify-between items-center border-2 border-white shadow-xl">
                            <p id="suggestion-hint" class="font-bold"></p>
                            <button onclick="applyAutoFill()" class="bg-white text-blue-700 px-3 py-1.5 rounded-lg font-black uppercase">Applica</button>
                        </div>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="input-iban" placeholder="IBAN" class="w-full p-4 bg-slate-50 rounded-xl font-mono uppercase text-xs outline-none">
                    <input type="text" id="input-causale" placeholder="Causale" class="w-full p-4 bg-slate-50 rounded-xl text-sm outline-none">
                    <div class="grid grid-cols-2 gap-3 p-4 bg-slate-50 rounded-xl">
                        <div><p class="text-[8px] font-black text-slate-400 uppercase text-center mb-1">Rata Attuale</p><input type="number" id="input-rate-done" value="1" class="w-full p-2 rounded-lg text-center font-bold outline-none"></div>
                        <div><p class="text-[8px] font-black text-slate-400 uppercase text-center mb-1">Totali</p><input type="number" id="input-rate-total" value="1" class="w-full p-2 rounded-lg text-center font-bold outline-none"></div>
                    </div>
                    <button onclick="addTransaction()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold active-scale uppercase tracking-widest shadow-lg">Conferma Transazione</button>
                </div>
            </div>
        </details>

        <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left"></div>

        <footer class="mt-20 border-t pt-10">
            <details class="group">
                <summary class="list-none text-center text-slate-300 text-[10px] font-bold cursor-pointer uppercase tracking-widest">Impostazioni Avanzate</summary>
                <div class="max-w-4xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-left">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Capitale Iniziale</label>
                        <div class="flex gap-2 mt-2">
                            <input type="number" id="conf-capitale" class="flex-1 p-4 bg-slate-50 rounded-xl outline-none font-bold">
                            <button onclick="saveConfig()" class="px-6 bg-slate-900 text-white rounded-xl font-bold uppercase text-xs active-scale">Salva</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-4">
                   <button onclick="downloadBackup()" class="p-4 bg-blue-50 text-blue-600 rounded-3xl text-[9px] font-black uppercase flex flex-col items-center gap-2 active-scale">
                   <i data-lucide="download" class="w-5 h-5"></i> Backup
                   </button>
                  <button onclick="clearLocalOnly()" class="p-4 bg-amber-50 text-amber-600 rounded-3xl text-[9px] font-black uppercase flex flex-col items-center gap-2 active-scale">
                   <i data-lucide="eraser" class="w-5 h-5"></i> Pulisci App
                   </button>
                 <button onclick="secureClear('all')" class="p-4 bg-rose-50 text-rose-600 rounded-3xl text-[9px] font-black uppercase flex flex-col items-center gap-2 active-scale">
                 <i data-lucide="trash-2" class="w-5 h-5"></i> Reset Cloud
                  </button>
                  </div>
                </div>
            </details>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB643qHcFEqfDEacGI6r0wpiQ84IHdzTg4",
            authDomain: "gestione-s-pro-ee3a1.firebaseapp.com",
            projectId: "gestione-s-pro-ee3a1",
            storageBucket: "gestione-s-pro-ee3a1.firebasestorage.app",
            messagingSenderId: "884336598623",
            appId: "1:884336598623:web:42cf9ba18f701e3af305ea"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        // --- STATO GLOBALE ---
        let userId = null;
        let localData = { config: { capitale: 0 }, storico: [] };
        const MACRO_PWD = "PRO2026";
        let currentAutoFillData = null;

        // --- GESTORE ACCESSO ---
        auth.onAuthStateChanged(user => {
            if (user) {
                userId = user.uid;
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                
                db.collection('users').doc(userId).onSnapshot(doc => { 
                    if (doc.exists) { 
                        localData = doc.data(); 
                        renderUI(); 
                    } else {
                        localData = { config: { capitale: 0 }, storico: [] };
                        db.collection('users').doc(userId).set(localData);
                    }
                });
            } else {
                userId = null;
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
            }
            lucide.createIcons();
        });

        // --- FUNZIONE AGGIUNGI (ROBUSTA) ---
        async function addTransaction() {
            if (!userId) return alert("Errore: sessione scaduta.");

            const amount = parseFloat(document.getElementById('input-amount').value);
            const to = document.getElementById('input-to').value;
            if (!amount || !to) return alert("Importo e Beneficiario obbligatori!");

            const dInput = document.getElementById('input-date').value;
            const d = dInput ? new Date(dInput) : new Date();
            const mainType = document.getElementById('input-type').value;
            let finalType = mainType;
            if (mainType === 'Spese Varie') {
                const sub = document.getElementById('sub-type-spese').value;
                finalType = sub === 'Altro' ? document.getElementById('input-altro-spec').value : sub;
            }

            const nuovo = {
                id: Date.now(),
                dataISO: d.toISOString(),
                dataVisuale: d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}),
                importo: amount,
                tipo: finalType.toUpperCase(),
                tipo_originale: mainType,
                beneficiario: to,
                iban: document.getElementById('input-iban').value.toUpperCase(),
                causale: document.getElementById('input-causale').value,
                ratePagate: parseInt(document.getElementById('input-rate-done').value) || 1,
                rateTotali: parseInt(document.getElementById('input-rate-total').value) || 1
            };

            try {
                // Aggiungiamo in locale e mandiamo al cloud
                localData.storico.unshift(nuovo);
                await db.collection('users').doc(userId).set(localData);
                
                // Reset UI
                document.getElementById('form-details').removeAttribute('open');
                document.getElementById('input-amount').value = '';
                document.getElementById('input-to').value = '';
                document.getElementById('input-causale').value = '';
                renderUI();
            } catch (err) {
                alert("Errore salvataggio: " + err.message);
                localData.storico.shift(); // Rimuovi se fallisce
            }
        }

        // --- RENDERING UI ---
        function renderUI() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const boxDebito = document.getElementById('box-debito');
            
            const filtered = localData.storico.filter(x => 
                x.beneficiario.toLowerCase().includes(search) || 
                (x.causale && x.causale.toLowerCase().includes(search)) ||
                x.tipo.toLowerCase().includes(search)
            );

            const totaleSpeso = search === "" ? localData.storico.reduce((a,b) => a+b.importo, 0) : filtered.reduce((a,b) => a+b.importo, 0);
            const saldo = localData.config.capitale - localData.storico.reduce((a,b) => a+b.importo, 0);

            let debitoFiltro = 0;
            if (search !== "") {
                const raggruppa = {};
                filtered.forEach(x => {
                    const k = `${x.beneficiario}-${x.tipo}`;
                    if(!raggruppa[k] || x.id > raggruppa[k].id) raggruppa[k] = (x.rateTotali - x.ratePagate) * x.importo;
                });
                debitoFiltro = Object.values(raggruppa).reduce((a,b) => a+b, 0);
                boxDebito.classList.replace('opacity-50', 'opacity-100');
            } else {
                boxDebito.classList.replace('opacity-100', 'opacity-50');
            }

            document.getElementById('txt-residuo').innerText = "€ " + saldo.toLocaleString('it-IT', {minimumFractionDigits:2});
            document.getElementById('txt-uscite-filtrate').innerText = "€ " + totaleSpeso.toLocaleString('it-IT', {minimumFractionDigits:2});
            document.getElementById('txt-debito-filtrato').innerText = "€ " + debitoFiltro.toLocaleString('it-IT', {minimumFractionDigits:2});
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

            document.getElementById('history-list').innerHTML = (search === "" ? localData.storico : filtered).map(x => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm fade-in relative">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[7px] font-black bg-slate-900 text-white px-2 py-0.5 rounded uppercase">${x.tipo}</span>
                            <h5 class="font-black text-slate-800 text-lg uppercase mt-1">${x.beneficiario}</h5>
                            <p class="text-[9px] font-bold text-slate-400">${x.dataVisuale}</p>
                            ${x.iban ? `<p class="text-[9px] font-mono text-blue-600 mt-1 break-all">IBAN: ${x.iban}</p>` : ''}
                            ${x.causale ? `<p class="text-[10px] italic text-slate-500 mt-2 border-l-2 border-slate-200 pl-2">"${x.causale}"</p>` : ''}
                        </div>
                        <div class="text-right">
                            <p class="font-black text-xl">-€${x.importo.toFixed(2)}</p>
                            <button onclick="deleteRow(${x.id})" class="text-slate-200 hover:text-rose-500 mt-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-50 text-center">
                        <div class="bg-slate-50 p-2 rounded-xl"><p class="text-[7px] font-black text-slate-400 uppercase">Rate</p><p class="text-[10px] font-black">${x.ratePagate}/${x.rateTotali}</p></div>
                        <div class="bg-slate-50 p-2 rounded-xl"><p class="text-[7px] font-black text-slate-400 uppercase">Residuo</p><p class="text-[10px] font-black text-orange-600">€ ${((x.rateTotali - x.ratePagate)*x.importo).toFixed(2)}</p></div>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        // --- ALTRE LOGICHE ---
        async function deleteRow(id) { if(prompt("Password Admin:") === MACRO_PWD) { localData.storico = localData.storico.filter(x => x.id !== id); await db.collection('users').doc(userId).set(localData); } }
        async function saveConfig() { localData.config.capitale = parseFloat(document.getElementById('conf-capitale').value) || 0; await db.collection('users').doc(userId).set(localData); alert("Capitale salvato!"); }
        // Questa gestisce l'accesso e la registrazione (LASCIALA)
        async function handleAuth(t) {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { t === 'login' ? await auth.signInWithEmailAndPassword(e, p) : await auth.createUserWithEmailAndPassword(e, p); } catch (err) { alert(err.message); }
        }
        // Questa è quella che abbiamo aggiunto ora per il ripristino (INCOLLALA QUI)
        async function resetPassword() {
        const email = document.getElementById('email').value;
        if (!email) {
        alert("Inserisci la tua email nel campo sopra per ricevere il link di ripristino.");
        return;
     }
    try {
        await auth.sendPasswordResetEmail(email);
        alert("Email di ripristino inviata! Controlla la tua posta (anche in Spam).");
    } catch (err) {
        alert("Errore: " + err.message);
    }
}
        function logout() { auth.signOut(); }
        function initFormTime() { const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); document.getElementById('input-date').value = now.toISOString().slice(0,16); }
        function toggleSpeseVarie(v) { document.getElementById('sub-spese-container').classList.toggle('hidden', v !== 'Spese Varie'); }
        function toggleAltroSpec(v) { document.getElementById('input-altro-spec').classList.toggle('hidden', v !== 'Altro'); }

        function checkAutoFill(val) {
            const box = document.getElementById('autofill-suggestion');
            if(val.length < 2) { box.classList.add('hidden'); return; }
            const match = localData.storico.find(x => x.beneficiario.toLowerCase() === val.toLowerCase().trim());
            if(match) {
                currentAutoFillData = match;
                document.getElementById('suggestion-hint').innerText = `Trovata rata: ${match.ratePagate}/${match.rateTotali}`;
                box.classList.remove('hidden');
            } else box.classList.add('hidden');
        }

        function applyAutoFill() {
            if(currentAutoFillData) {
                document.getElementById('input-iban').value = currentAutoFillData.iban || '';
                document.getElementById('input-type').value = currentAutoFillData.tipo_originale || 'Bonifico';
                document.getElementById('input-rate-total').value = currentAutoFillData.rateTotali;
                document.getElementById('input-rate-done').value = Math.min(currentAutoFillData.ratePagate + 1, currentAutoFillData.rateTotali);
                document.getElementById('input-amount').value = currentAutoFillData.importo;
                document.getElementById('autofill-suggestion').classList.add('hidden');
            }
        }

        function openDebitoModal() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            if(search === "") return;
            const container = document.getElementById('lista-debiti-dettaglio');
            const filtered = localData.storico.filter(x => x.beneficiario.toLowerCase().includes(search));
            const raggruppa = {};
            filtered.forEach(x => {
                const k = `${x.beneficiario} (${x.tipo})`;
                if(!raggruppa[k] || x.id > raggruppa[k].id) raggruppa[k] = { res: (x.rateTotali-x.ratePagate)*x.importo, pag: x.ratePagate, tot: x.rateTotali };
            });
            container.innerHTML = Object.entries(raggruppa).map(([n, d]) => `
                <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-orange-100">
                    <div><p class="font-black text-[10px] uppercase">${n}</p><p class="text-[9px] text-slate-400">Rate: ${d.pag}/${d.tot}</p></div>
                    <p class="text-orange-600 font-black">€ ${d.res.toFixed(2)}</p>
                </div>`).join('');
            document.getElementById('modal-debito').classList.remove('hidden');
        }

        function closeDebitoModal() { document.getElementById('modal-debito').classList.add('hidden'); }

        function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4'); 

    doc.setFontSize(18);
    doc.text("REPORT DETTAGLIATO FINANZE PRO", 14, 15);
    
    doc.setFontSize(9);
    doc.text(`Generato il: ${new Date().toLocaleString('it-IT')}`, 14, 22);

    const headers = [['DATA', 'BENEFICIARIO', 'IBAN', 'CAUSALE', 'RATE', 'PAGATO', 'RESIDUO']];
    
    const rows = localData.storico.map(x => {
        const rateRestanti = x.rateTotali - x.ratePagate;
        return [
            x.dataVisuale,
            x.beneficiario.toUpperCase(),
            x.iban || '-',
            (x.causale || "-").toUpperCase(),
            `${x.ratePagate}/${x.rateTotali}`,
            `€ ${(x.importo * x.ratePagate).toFixed(2)}`,
            `€ ${(x.importo * rateRestanti).toFixed(2)}`
        ];
    });

    doc.autoTable({
        startY: 28,
        head: headers,
        body: rows,
        theme: 'striped',
        headStyles: { fillColor: [30, 41, 59], fontSize: 8, halign: 'center' },
        styles: { fontSize: 7, cellPadding: 2, valign: 'middle' },
        columnStyles: { 
            0: { cellWidth: 25 }, 
            1: { cellWidth: 40 }, 
            2: { cellWidth: 45 }, 
            3: { cellWidth: 50 }, 
            4: { halign: 'center' }, 
            5: { halign: 'right' }, 
            6: { halign: 'right' } 
        }
    });

    const totaleResiduoComplessivo = localData.storico.reduce((acc, x) => acc + ((x.rateTotali - x.ratePagate) * x.importo), 0);
    doc.setFontSize(10);
    doc.text(`Totale Debito Residuo Complessivo: € ${totaleResiduoComplessivo.toLocaleString('it-IT', {minimumFractionDigits:2})}`, 14, doc.lastAutoTable.finalY + 10);
    
    doc.save('Report_FinanzePro.pdf');
}

// Crea un file .json con tutti i tuoi dati e lo fa scaricare
function downloadBackup() {
    if (!localData || !localData.storico || localData.storico.length === 0) {
        alert("Non ci sono dati da salvare nel backup!");
        return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localData));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = "Backup_FinanzePro_" + new Date().toLocaleDateString('it-IT').replace(/\//g, '-') + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
}

// --- 2. FUNZIONE ELIMINA LOCALE ---
// Svuota la schermata ma NON tocca il database online
function clearLocalOnly() {
    if(confirm("Vuoi svuotare i dati visibili in questa schermata?\n\nTranquillo: i dati sul Cloud di Firebase NON verranno cancellati. Basterà ricaricare la pagina per rivederli.")) {
        // Svuota la memoria temporanea del browser
        localData = { config: { capitale: 0 }, storico: [] };
        // Aggiorna la grafica (che ora sarà vuota)
        renderUI();
    }
}
